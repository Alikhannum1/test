<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Простая викторина</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .quiz-container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #4a90e2;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            text-align: left;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #e2e2e2;
        }
        .btn.correct {
            background-color: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
        }
        .btn.wrong {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        #next-btn {
            display: none;
            background-color: #4a90e2;
            color: white;
            border: none;
            text-align: center;
            margin-top: 15px;
        }
        #next-btn:hover {
            background-color: #357abd;
        }
        .result {
            text-align: center;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div id="quiz">
            <h2 id="question">Вопрос появится здесь</h2>
            <div id="answer-buttons">
                <!-- Кнопки с вариантами ответов будут создаваться через JS -->
            </div>
            <button id="next-btn" class="btn">Следующий вопрос</button>
        </div>
    </div>

    <script>
        // Массив с вопросами
        const questions = [
            {
                question: "Какая столица Франции?",
                answers: [
                    { text: "Лондон", correct: false },
                    { text: "Париж", correct: true },
                    { text: "Берлин", correct: false },
                    { text: "Мадрид", correct: false }
                ]
            },
            {
                question: "Сколько планет в Солнечной системе?",
                answers: [
                    { text: "7", correct: false },
                    { text: "8", correct: true },
                    { text: "9", correct: false },
                    { text: "10", correct: false }
                ]
            },
            {
                question: "Какой язык программирования мы используем в этом примере для логики?",
                answers: [
                    { text: "Python", correct: false },
                    { text: "C++", correct: false },
                    { text: "JavaScript", correct: true },
                    { text: "Java", correct: false }
                ]
            }
        ];

        const questionElement = document.getElementById("question");
        const answerButtonsElement = document.getElementById("answer-buttons");
        const nextButton = document.getElementById("next-btn");

        let currentQuestionIndex = 0;
        let score = 0;

        function startQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            nextButton.innerHTML = "Следующий вопрос";
            showQuestion();
        }

        function showQuestion() {
            resetState();
            let currentQuestion = questions[currentQuestionIndex];
            let questionNo = currentQuestionIndex + 1;
            questionElement.innerHTML = `${questionNo}. ${currentQuestion.question}`;

            currentQuestion.answers.forEach(answer => {
                const button = document.createElement("button");
                button.innerHTML = answer.text;
                button.classList.add("btn");
                if (answer.correct) {
                    button.dataset.correct = answer.correct;
                }
                button.addEventListener("click", selectAnswer);
                answerButtonsElement.appendChild(button);
            });
        }

        function resetState() {
            nextButton.style.display = "none";
            while (answerButtonsElement.firstChild) {
                answerButtonsElement.removeChild(answerButtonsElement.firstChild);
            }
        }

        function selectAnswer(e) {
            const selectedBtn = e.target;
            const isCorrect = selectedBtn.dataset.correct === "true";

            if (isCorrect) {
                selectedBtn.classList.add("correct");
                score++;
            } else {
                selectedBtn.classList.add("wrong");
            }

            // Подсветить правильный ответ, если пользователь ошибся, и отключить все кнопки
            Array.from(answerButtonsElement.children).forEach(button => {
                if (button.dataset.correct === "true") {
                    button.classList.add("correct");
                }
                button.disabled = true;
            });

            nextButton.style.display = "block";
        }

        function showScore() {
            resetState();
            questionElement.innerHTML = `Викторина завершена!<br> Вы набрали <b>${score}</b> из <b>${questions.length}</b> правильных ответов.`;
            nextButton.innerHTML = "Пройти снова";
            nextButton.style.display = "block";
        }

        function handleNextButton() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                showQuestion();
            } else {
                showScore();
            }
        }

        nextButton.addEventListener("click", () => {
            if (currentQuestionIndex < questions.length) {
                handleNextButton();
            } else {
                startQuiz();
            }
        });

        // Запуск викторины при загрузке страницы
        startQuiz();
    </script>

</body>
</html>
